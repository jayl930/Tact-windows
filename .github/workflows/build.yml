name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

      # Tag pushes: build with signing via key file, then create release
      - name: Write signing key to file
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > "$RUNNER_TEMP/signing-key.key"

      - name: Debug signing key
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          echo "Key file size: $(wc -c < "$RUNNER_TEMP/signing-key.key") bytes"
          echo "Key file lines: $(wc -l < "$RUNNER_TEMP/signing-key.key")"
          head -c 30 "$RUNNER_TEMP/signing-key.key"
          echo "..."

      - name: Build with signing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ runner.temp }}/signing-key.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Verify signatures exist
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "=== NSIS bundle files ==="
          dir src-tauri\target\release\bundle\nsis\
          echo "=== MSI bundle files ==="
          dir src-tauri\target\release\bundle\msi\

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: "echo skip"
          tagName: v__VERSION__
          releaseName: "Tact v__VERSION__"
          releaseBody: "Download the .exe installer below to install Tact for Windows."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # Non-tag pushes: build without signing
      - name: Build only
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: tact-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
