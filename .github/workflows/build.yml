name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

      # Tag pushes: build, sign manually, then create release
      - name: Build
        if: startsWith(github.ref, 'refs/tags/')
        run: npx tauri build

      - name: Sign bundles manually
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd src-tauri/target/release/bundle
          # Create NSIS zip and sign it
          cd nsis
          7z a -tzip Tact_*_x64-setup.nsis.zip Tact_*_x64-setup.exe
          npx tauri signer sign Tact_*_x64-setup.nsis.zip -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          ls -la
          cd ../msi
          # Create MSI zip and sign it
          7z a -tzip Tact_*_x64_en-US.msi.zip Tact_*_x64_en-US.msi
          npx tauri signer sign Tact_*_x64_en-US.msi.zip -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          ls -la

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: "echo skip"
          tagName: v__VERSION__
          releaseName: "Tact v__VERSION__"
          releaseBody: "Download the .exe installer below to install Tact for Windows."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # Non-tag pushes: build without signing
      - name: Build only
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: tact-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
