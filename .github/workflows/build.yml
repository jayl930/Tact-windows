name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

      # Tag pushes: build, sign manually, then create release
      - name: Build
        if: startsWith(github.ref, 'refs/tags/')
        run: npx tauri build

      - name: Sign bundles manually
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Sign NSIS bundle
          NSIS_DIR="src-tauri/target/release/bundle/nsis"
          NSIS_EXE=$(ls "$NSIS_DIR"/*.exe | head -1)
          NSIS_BASE=$(basename "$NSIS_EXE" .exe)
          NSIS_ZIP="$NSIS_DIR/${NSIS_BASE}.nsis.zip"
          echo "Creating $NSIS_ZIP from $NSIS_EXE"
          (cd "$NSIS_DIR" && 7z a -tzip "$(basename "$NSIS_ZIP")" "$(basename "$NSIS_EXE")")
          echo "Signing $NSIS_ZIP"
          npx tauri signer sign "$NSIS_ZIP" -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          ls -la "$NSIS_DIR"

          # Sign MSI bundle
          MSI_DIR="src-tauri/target/release/bundle/msi"
          MSI_FILE=$(ls "$MSI_DIR"/*.msi | head -1)
          MSI_BASE=$(basename "$MSI_FILE" .msi)
          MSI_ZIP="$MSI_DIR/${MSI_BASE}.msi.zip"
          echo "Creating $MSI_ZIP from $MSI_FILE"
          (cd "$MSI_DIR" && 7z a -tzip "$(basename "$MSI_ZIP")" "$(basename "$MSI_FILE")")
          echo "Signing $MSI_ZIP"
          npx tauri signer sign "$MSI_ZIP" -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          ls -la "$MSI_DIR"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: "echo skip"
          tagName: v__VERSION__
          releaseName: "Tact v__VERSION__"
          releaseBody: "Download the .exe installer below to install Tact for Windows."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # Non-tag pushes: build without signing
      - name: Build only
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: tact-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
